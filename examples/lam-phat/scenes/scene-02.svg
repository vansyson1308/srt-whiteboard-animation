    <ellipse cx="790" cy="750" rx="48" ry="16" fill="#f6c453" stroke="#2b2b2b" stroke-width="5"/>
    <ellipse cx="790" cy="730" rx="48" ry="16" fill="#f6c453" stroke="#2b2b2b" stroke-width="5"/>
