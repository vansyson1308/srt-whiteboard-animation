    <text x="1100" y="347" text-anchor="middle" font-family="Patrick Hand" font-size="50" fill="#2b2b2b">lười?</text>
    <path d="M1232 302 L 1288 358 M1288 302 L 1232 358" fill="none" stroke="#e04b3a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="heal" data-label="Tự chữa lành" data-say="tự chữa lành">
    <path d="M1150 648 C 1066 588, 1090 516, 1150 558 C 1210 516, 1234 588, 1150 648 Z" fill="#e04b3a" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
