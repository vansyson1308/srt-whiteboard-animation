<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Kết -->
  <g id="sleep" data-label="Giấc ngủ" data-say="ngủ đủ">
    <circle cx="450" cy="330" r="90" fill="#e6e6e6" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="423" cy="312" r="16" fill="#ffffff" stroke="#9a9a9a" stroke-width="4"/>
    <circle cx="482" cy="352" r="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="4"/>
    <circle cx="459" cy="290" r="8" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
    <text x="620" y="330" text-anchor="middle" font-family="Patrick Hand" font-size="70" fill="#3b7dd8">Z z z</text>
    <circle cx="450" cy="590" r="28" fill="#ffffff" stroke="#2b2b2b" stroke-width="5"/>
    <path d="M440 584 l 0 3 M460 584 l 0 3 M440 598 q 10 9 20 0" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M450 618 L 450 710 M420 780 L 450 710 L 480 780" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M412 690 L 450 638 L 488 690" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="not" data-label="Không phải lười" data-say="không phải là lười">
